{% extends "base.html" %}
{% block content %}
<h2>All Posts</h2>
{% for post in posts %}
  <div class="post">
    <h3><a href="{{ url_for('post', post_id=post.id) }}">{{ post.title }}</a></h3>
    <p>{{ post.content[:100] }}...</p>
    <small>Author: {{ post.author.username }}</small>
  </div>
{% else %}
  <p>No posts available yet.</p>
{% endfor %}
{% endblock %}
