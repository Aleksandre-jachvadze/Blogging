<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Students List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Students List</h1>
        <nav>
            <a href="{{ url_for('main.add_student') }}">Add New Student</a>
        </nav>
    </header>
    <main>
        <input type="text" id="searchInput" placeholder="Search by name...">
        <table>
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Classroom</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentsTable">
                {% for student in students %}
                <tr>
                    <td>{{ student.first_name }}</td>
                    <td>{{ student.last_name }}</td>
                    <td>{{ student.email }}</td>
                    <td>{{ student.classroom }}</td>
                    <td>
                        <a href="{{ url_for('main.edit_student', id=student.id) }}">Edit</a>
                        <a href="{{ url_for('main.delete_student', id=student.id) }}" class="delete-btn">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </main>
    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>
